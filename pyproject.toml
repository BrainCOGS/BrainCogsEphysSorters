[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "u19-sorting"
version = "0.1.1"
description = "BRAINCoGS scripts to process electrophysiology data"
readme = "README.md"
license-files = [
    "LICENSE*"
    ]
authors = [
    { name = "BRAINCoGS"},
    { name = "Alvaro Luna", email = "alvaros@princeton.edu" },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu" },
]
dependencies = [
    "ONE-api>=3.4.1",
    "ibllib>=4.0.1",
    "kilosort[gui]",
    "numpy",
    "pandas",
    "spikeinterface>=0.104.8",
]
requires-python = ">= 3.13"


[tool.hatch.build.targets.sdist]
include = [
    "/u19_sorting",
]

# Point Pyright / basedpyright (and Pylance) at the uv-managed virtualenv so imports of
# spikeinterface, torch, kilosort, etc. resolve instead of being flagged as missing.
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv]
# Supply-chain quarantine: ignore anything published in the last 7 days when
# resolving. A compromised release is usually caught and yanked within days, so
# waiting a week costs little and skips the window when a malicious version is
# most likely to still be up. uv re-evaluates this relative value on every
# resolution, so the window rolls forward on its own. "7 days" is the documented
# friendly-duration form (ISO 8601 "P7D" is equivalent).
#
# Consequence to expect: immediately after an upstream release, `uv lock` will
# decline to pick it up until it is a week old. That is the feature working. To
# take a fresh release deliberately, run
#   uv lock --exclude-newer <a timestamp after that upload>
# or add a scoped exemption via `exclude-newer-package`.
exclude-newer = "7 days"

# `uv audit` is still gated behind a preview flag. Declaring it here means the
# command runs without `--preview-features audit-command` on the command line.
preview-features = ["audit-command"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--showlocals", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
log_level = "INFO"
filterwarnings = ["error"]
# The smoke tests only need the standard library, so CI can run them without
# installing the (very large) GPU/spike-sorting dependency tree. Importing the
# package from the repo root keeps that working.
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
# Vendored third-party code; see .pre-commit-config.yaml.
extend-exclude = ["sorters", "preprocess_libs"]

[tool.ruff.lint]
extend-select = [
    "A",    # flake8-builtins: shadowing built-ins
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T100", # leftover breakpoints / debugger calls
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "N815",   # mixedCase class attrs
    "A002",   # argument shadows builtin
    "N806",   # non-lowercase local variable
    "E501",   # long lines: ruff format owns wrapping; remaining ones are strings/comments (sbatch examples)
    "N801",   # lowercase class names (cat_gt, dredge, ...) are public API used across modules; not renaming
    "N802",   # run_Kilosort2/3/4 etc. are public API used across modules; not renaming
    "PLW1510",  # subprocess.run without check: callers inspect returncode/stderr themselves
    "TRY002", # bare Exception in the job scripts; changing exception types alters behavior
    "RUF059", # unused unpacked stdout/stderr from communicate(); harmless
    "C408",   # dict(...) calls read fine for keyword-style parameter dicts
]

[tool.ruff.lint.per-file-ignores]
"main_script.py" = ["SIM112"]  # env var names are set lowercase by the slurm --export
"u19_sorting/config.py" = ["SIM108"]  # explicit if/else kept for readability
"u19_sorting/preprocess_wrappers.py" = ["A001"]  # local named `dir`; renaming is not worth the churn
"u19_sorting/sorter_wrappers.py" = ["BLE001"]  # broad except deliberately logs and continues
