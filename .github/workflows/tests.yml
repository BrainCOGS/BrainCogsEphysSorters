name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Only the dev group is installed. The project's runtime dependencies pull in
      # torch with its CUDA wheels (several GB) and there is no GPU on the runner;
      # the smoke tests need nothing beyond the standard library. `--locked` still
      # fails the job if uv.lock is out of date with pyproject.toml.
      - name: Install test dependencies
        run: uv sync --locked --only-group dev

      - name: Run tests
        run: uv run --no-sync pytest

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Audits the locked tree against OSV and fails the job on any finding.
      # `--locked` additionally asserts uv.lock is up to date with pyproject.toml.
      - name: Audit dependencies
        run: uv audit --locked
